version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: omlapay-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omlapay}
      POSTGRES_USER: ${POSTGRES_USER:-omlapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omlapay}
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omlapay} -d ${POSTGRES_DB:-omlapay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: omlapay-api-dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-omlapay}
      POSTGRES_USER: ${POSTGRES_USER:-omlapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omlapay}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm start:dev"
    env_file:
      - .env

volumes:
  db_data_dev:
    driver: local
