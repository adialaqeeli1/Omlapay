version: '3.9'

services:
  omlapay-admin-dev:
    image: omlapay-admin-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
  pnpm-store:
