flutter_launcher_icons:
  # General (Default/Light)
  image_path: "assets/logo/logo-dark.png"

  # Android
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/logo-dark.png"

  # iOS
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark: "assets/logo/logo-dark.png"
